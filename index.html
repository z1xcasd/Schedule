html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Sarabun',system-ui,sans-serif;font-size:17px}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;
  padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;background:var(--bg);border-bottom:1px solid var(--line)}
header h1{margin:0;font-size:22px;font-weight:700}
.icon-btn{border:0;background:transparent;color:var(--ink);font-size:26px;padding:6px 10px;border-radius:10px;font-family:inherit}
main{padding:12px 16px 140px;max-width:640px;margin:0 auto}
.day{margin:18px 0 8px;font-weight:700;color:var(--muted);font-size:15px;display:flex;gap:8px;align-items:center}
.day .today{background:var(--accent);color:var(--accent-ink);border-radius:99px;padding:1px 10px;font-size:13px}
.item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px;display:flex;gap:12px}
.item .t{font-weight:700;min-width:52px;color:var(--accent)}
.item .b{flex:1;min-width:0}
.item .title{font-weight:500}
.item .sub{color:var(--muted);font-size:15px;margin-top:2px;word-break:break-word}
.empty{text-align:center;color:var(--muted);margin-top:60px;line-height:1.7}
.dock{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;align-items:center;gap:22px;
  padding:14px 16px calc(env(safe-area-inset-bottom) + 18px);background:linear-gradient(transparent,var(--bg) 40%)}
.fab{width:76px;height:76px;border-radius:50%;border:0;padding:0;background:#0f766e;color:#fff;display:flex;align-items:center;justify-content:center;
  box-shadow:0 8px 24px rgba(15,118,110,.4)}
.fab:active{transform:scale(.95)}
.side{width:48px;height:48px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:20px;font-family:inherit}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:20}
.sheet-bg.show{display:flex}
.sheet{width:100%;max-width:640px;background:var(--card);border-radius:22px 22px 0 0;padding:20px 18px calc(env(safe-area-inset-bottom) + 20px);max-height:92vh;overflow:auto}
.sheet h2{margin:0 0 12px;font-size:19px}
label{display:block;font-size:14px;color:var(--muted);margin:12px 0 4px}
input,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
input.need{border-color:var(--warn)}
textarea{min-height:92px;resize:vertical}
.row{display:flex;gap:10px}.row>div{flex:1}
.btns{display:flex;gap:10px;margin-top:18px}
.btn{flex:1;border:0;border-radius:14px;padding:13px;font:inherit;font-weight:700;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:500}
.btn:disabled{opacity:.5}
.raw{font-size:14px;color:var(--muted);background:var(--bg);border-radius:10px;padding:8px 10px;margin-bottom:4px;word-break:break-word}
.hint{font-size:14px;color:var(--warn);margin:6px 0 0}
.listen{text-align:center}
.pulse{width:84px;height:84px;border-radius:50%;background:var(--accent);margin:8px auto 16px;animation:p 1.2s infinite}
@keyframes p{0%{box-shadow:0 0 0 0 rgba(45,212,191,.5)}100%{box-shadow:0 0 0 30px rgba(45,212,191,0)}}
.transcript{min-height:56px;font-size:19px;line-height:1.5;word-break:break-word}
.toast{position:fixed;left:50%;bottom:130px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-size:15px;z-index:40;opacity:0;pointer-events:none;transition:opacity .2s;max-width:88vw;text-align:center}
.toast.show{opacity:1}
.item{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;transition:transform .15s,opacity .15s}
.item.press{transform:scale(.98);opacity:.85}
.act-title{font-weight:700;font-size:19px}
.act-sub{color:var(--muted);font-size:15px;margin:2px 0 8px}
.act{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--ink);font:inherit;padding:15px 4px}
.act.danger{color:var(--danger)}
.typehelp{color:var(--muted);font-size:14px;margin-bottom:8px}
.tprev{margin-top:8px;font-size:14px;line-height:1.7}
.tprev span{display:inline-block;margin:0 6px 4px 0;padding:2px 10px;border-radius:999px;background:var(--bg);border:1px solid var(--line)}
.tprev span.skipped{color:var(--muted);border-style:dashed}
.tprev span.bad{border-color:var(--warn);color:var(--warn)}
.filebtn{display:block;text-align:center;border:1px dashed var(--accent);color:var(--accent);border-radius:14px;padding:13px;font-weight:700;cursor:pointer}
.irow{display:flex;gap:10px;align-items:flex-start;padding:10px 4px;border-bottom:1px solid var(--line)}
.irow input{width:auto;margin-top:4px;flex:none;transform:scale(1.3)}
.irow .tt{font-weight:600}.irow .ss{color:var(--muted);font-size:14px;word-break:break-word}
.irow.dup{opacity:.6}.irow .tag{display:inline-block;font-size:12px;border:1px solid var(--warn);color:var(--warn);border-radius:99px;padding:0 8px;margin-left:6px}
</style>
</head>
<body>
<header>
  <h1>ตารางงาน</h1>
  <button class="icon-btn" id="btnRef" aria-label="รีเฟรช">↻</button>
</header>
<main id="list"></main>

<div class="dock">
  <button class="fab" id="btnAdd" aria-label="เพิ่มนัด"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
</div>

<div class="sheet-bg" id="bgType"><div class="sheet">
  <h2>บันทึกตารางงาน</h2>
  <div class="typehelp">หัวข้อตามลำดับ<br>วันที่เวลา · เรื่อง · สถานที่ · ผู้เกี่ยวข้อง · การแต่งกาย</div>
  <textarea id="typed" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="done" placeholder="วันที่เวลา · เรื่อง · สถานที่ · ผู้เกี่ยวข้อง · การแต่งกาย"></textarea>
  <div class="tprev" id="tPrev"></div>
  <button class="btn ghost" id="tImport" style="width:100%;margin-top:14px">📋 นำเข้าทั้งตาราง (รูป / วางข้อความ)</button>
  <div class="btns">
    <button class="btn ghost" data-close="bgType">ปิด</button>
    <button class="btn" id="tGo">ตรวจสอบ</button>
  </div>
</div></div>

<div class="sheet-bg" id="bgImp"><div class="sheet">
  <h2>นำเข้าทั้งตาราง</h2>
  <div id="impIn">
    <div class="typehelp">เลือกรูปหรือแคปหน้าจอตารางงานประจำสัปดาห์ ให้ Gemini อ่านทุกแถว แล้วตรวจก่อนบันทึก</div>
    <label class="filebtn" for="impFile">📷 เลือกรูปตาราง (เลือกได้หลายรูป)</label>
    <input type="file" id="impFile" accept="image/*" multiple hidden>
    <div class="typehelp" id="impName" style="margin-top:6px"></div>
    <label>หรือวางข้อความที่คัดลอกจากตาราง (Excel / Sheets / Word)</label>
    <textarea id="impText" spellcheck="false" placeholder="วางข้อความตารางที่นี่"></textarea>
  </div>
  <div id="impOut" style="display:none">
    <div class="typehelp" id="impSum"></div>
    <div id="impList"></div>
  </div>
  <div class="btns">
    <button class="btn ghost" data-close="bgImp">ปิด</button>
    <button class="btn" id="impRead">อ่านตาราง</button>
    <button class="btn" id="impSave" style="display:none">บันทึกที่เลือก</button>
  </div>
</div></div>

<div class="sheet-bg" id="bgConfirm"><div class="sheet">
  <h2>ตรวจสอบก่อนบันทึก</h2>
  <div class="raw" id="cRaw"></div>
  <div class="row">
    <div><label>วันที่</label><input id="cDate" type="date"></div>
    <div><label>เวลา</label><input id="cTime" type="time"></div>
  </div>
  <label>เรื่อง</label><input id="cTitle" enterkeyhint="next">
  <label>สถานที่</label><input id="cLoc" enterkeyhint="next">
  <label>ผู้เกี่ยวข้อง</label><input id="cChair" enterkeyhint="next" placeholder="เช่น รอง ผบ.ศสร. 1">
  <label>การแต่งกาย</label><input id="cDress" enterkeyhint="next" placeholder="เช่น ชุดสีกากี">
  <label>หน่วยรับผิดชอบ/ผู้บันทึกข้อมูล</label><input id="cOwner" enterkeyhint="next" placeholder="ดูได้ในแอป ไม่ส่งเข้าไลน์">
  <label>รายละเอียดอื่นๆ</label><input id="cDet">
  <div class="hint" id="cHint" style="display:none"></div>
  <div class="btns">
    <button class="btn ghost" data-close="bgConfirm">ยกเลิก</button>
    <button class="btn" id="cSave">บันทึกลงปฏิทิน</button>
  </div>
</div></div>

<div class="sheet-bg" id="bgSet"><div class="sheet">
  <h2>ตั้งค่า</h2>
  <label>ลิงก์เว็บแอป (Apps Script /exec)</label><input id="sUrl" inputmode="url" placeholder="https://script.google.com/macros/s/.../exec">
  <label>รหัส (APP_TOKEN)</label><input id="sTok" autocapitalize="off" autocomplete="off">
  <div class="btns">
    <button class="btn ghost" data-close="bgSet">ปิด</button>
    <button class="btn" id="sSave">บันทึกและทดสอบ</button>
  </div>
</div></div>

<div class="sheet-bg" id="bgAct"><div class="sheet">
  <div class="act-title" id="aTitle"></div>
  <div class="act-sub" id="aSub"></div>
  <button class="act" id="aHour">⏩ เลื่อน +1 ชั่วโมง</button>
  <button class="act" id="aTomorrow">⏩ เลื่อนไปพรุ่งนี้ (เวลาเดิม)</button>
  <button class="act" id="aEdit">✎ แก้ไข / เลือกวัน-เวลาใหม่</button>
  <button class="act danger" id="aDel">✕ ยกเลิกนัด</button>
  <div class="btns"><button class="btn ghost" data-close="bgAct">ปิด</button></div>
</div></div>

<div class="toast" id="toast"></div>

<script>
const $ = id => document.getElementById(id);
const store = {
  get(k){ try{ return localStorage.getItem(k) || ''; }catch(e){ return ''; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
};
let cfg = { url: store.get('url'), token: store.get('token') };
let rawText = '', items = [], editId = '', cur = null;

function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(msg, ms=2600){ const t=$('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),ms); }
function open(id){ $(id).classList.add('show'); }
function close(id){ $(id).classList.remove('show'); if (id === 'bgConfirm') editId = ''; }
document.querySelectorAll('[data-close]').forEach(b => b.onclick = () => close(b.dataset.close));

const todayISO = () => new Date().toLocaleDateString('sv-SE', { timeZone: 'Asia/Bangkok' });

async function api(action, payload = {}) {
  if (!cfg.url || !cfg.token) { open('bgSet'); throw new Error('ตั้งค่าลิงก์และรหัสก่อน'); }
  const r = await fetch(cfg.url, { method: 'POST', body: JSON.stringify({ token: cfg.token, action, ...payload }) });
  const j = await r.json();
  if (!j.ok) throw new Error(j.error || 'เกิดข้อผิดพลาด');
  return j.data;
}

function fmtDay(d){
  return new Date(d + 'T00:00:00+07:00').toLocaleDateString('th-TH',
    { weekday:'long', day:'numeric', month:'long', year:'numeric', timeZone:'Asia/Bangkok' });
}
function render(){
  const el = $('list');
  const now = Date.now();
  const list = items.filter(it => it.endMs > now);
  if (!list.length){ el.innerHTML = '<div class="empty">ไม่มีนัดที่จะถึง<br>กด + แล้วพิมพ์ได้เลย</div>'; return; }
  const t = todayISO(); let html = '', last = '';
  for (const it of list){
    if (it.date !== last){
      last = it.date;
      html += `<div class="day">${esc(fmtDay(it.date))}${it.date===t?'<span class="today">วันนี้</span>':''}</div>`;
    }
    const subs = [it.location, it.chair && 'ผู้เกี่ยวข้อง : ' + it.chair, it.dress && 'การแต่งกาย : ' + it.dress, it.owner && 'ผู้รับผิดชอบ : ' + it.owner, it.details]
      .filter(Boolean).map(x => `<div class="sub">${esc(x)}</div>`).join('');
    html += `<div class="item" data-id="${esc(it.id)}"><div class="t">${esc(it.time)}</div><div class="b"><div class="title">${esc(it.title)}</div>${subs}</div></div>`;
  }
  el.innerHTML = html;
  el.querySelectorAll('.item').forEach(bindPress);
}
async function refresh(){
  const el = $('list');
  if (!cfg.url || !cfg.token) { el.innerHTML = '<div class="empty">ยังไม่ได้ตั้งค่า<br>กรอกลิงก์และรหัสในหน้าต่างที่ขึ้นมา</div>'; return; }
  try{
    items = await api('list');
    items.sort((a,b) => (a.date+a.time).localeCompare(b.date+b.time));
    render();
  }catch(e){ el.innerHTML = `<div class="empty">โหลดไม่ได้<br>${esc(e.message)}</div>`; }
}
setInterval(render, 60000);

function bindPress(el){
  let timer = null;
  const cancel = () => { clearTimeout(timer); timer = null; el.classList.remove('press'); };
  el.addEventListener('touchstart', () => {
    el.classList.add('press');
    timer = setTimeout(() => { cancel(); if (navigator.vibrate) navigator.vibrate(20); openAct(el.dataset.id); }, 500);
  }, { passive: true });
  el.addEventListener('touchmove', cancel, { passive: true });
  el.addEventListener('touchend', cancel);
  el.addEventListener('touchcancel', cancel);
  el.addEventListener('contextmenu', e => { e.preventDefault(); cancel(); openAct(el.dataset.id); });
}
function openAct(id){
  cur = items.find(i => i.id === id); if (!cur) return;
  $('aTitle').textContent = cur.title;
  $('aSub').textContent = fmtDay(cur.date) + ' · ' + cur.time;
  open('bgAct');
}
function shift(it, addMs){
  const d = new Date(new Date(it.date + 'T' + it.time + ':00+07:00').getTime() + addMs);
  return {
    date: d.toLocaleDateString('sv-SE', { timeZone: 'Asia/Bangkok' }),
    time: d.toLocaleTimeString('en-GB', { timeZone: 'Asia/Bangkok', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' })
  };
}
async function doMove(addMs){
  close('bgAct'); toast('กำลังเลื่อน…', 8000);
  const n = shift(cur, addMs);
  try{
    await api('update', { id: cur.id, title: cur.title, date: n.date, time: n.time, location: cur.location, chair: cur.chair, dress: cur.dress, owner: cur.owner, details: cur.details });
    toast('เลื่อนแล้ว ✓'); refresh();
  }catch(e){ toast(e.message, 4000); }
}
$('aHour').onclick = () => doMove(3600000);
$('aTomorrow').onclick = () => doMove(86400000);
$('aEdit').onclick = () => {
  close('bgAct'); editId = cur.id;
  $('cRaw').textContent = 'แก้ไขนัด';
  $('cTitle').value = cur.title; $('cDate').value = cur.date; $('cTime').value = cur.time;
  $('cLoc').value = cur.location; $('cChair').value = cur.chair || ''; $('cDress').value = cur.dress || ''; $('cOwner').value = cur.owner || ''; $('cDet').value = cur.details;
  $('cHint').style.display = 'none';
  open('bgConfirm');
};
$('aDel').onclick = async () => {
  if (!confirm('ยกเลิกนัด "' + cur.title + '" ?\nจะลบออกจากปฏิทินด้วย')) return;
  close('bgAct'); toast('กำลังยกเลิก…', 8000);
  try{ await api('delete', { id: cur.id }); toast('ยกเลิกนัดแล้ว ✓'); refresh(); }
  catch(e){ toast(e.message, 4000); }
};

const TFIELDS = ['วันที่เวลา', 'เรื่อง', 'สถานที่', 'ผู้เกี่ยวข้อง', 'การแต่งกาย'];
function splitTyped(t){
  t = t.replace(/\r/g, '').trim();
  if (!t) return [];
  const parts = t.split(/(\s{2,}|\n+)/), out = [parts[0].trim()];
  for (let i = 1; i < parts.length; i += 2){
    const sep = parts[i], k = Math.max(1, /\n/.test(sep) ? 1 : Math.floor(sep.length / 2));
    for (let j = 1; j < k; j++) out.push('');
    out.push((parts[i + 1] || '').trim());
  }
  while (out.length && !out[out.length - 1]) out.pop();
  return out;
}
function spellT(t){ return t.replace(/\([^)]*\)|（[^）]*）/g, ' ').replace(/บอ[\s-]*กอ/g, 'บก.').replace(/\s+/g, ' ').trim(); }
$('btnAdd').onclick = () => { open('bgType'); setTimeout(() => $('typed').focus(), 150); };
$('typed').addEventListener('input', () => {
  const p = splitTyped($('typed').value);
  $('tPrev').innerHTML = p.map((x, i) => `<span${x ? '' : ' class="skipped"'}>${esc(TFIELDS[i] || 'รายละเอียด')}: ${esc(x || '— ข้าม')}</span>`).join('');
});
$('typed').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && e.keyCode !== 229){ e.preventDefault(); $('tGo').click(); }
});
const MON = { 'มค':1,'กพ':2,'มีค':3,'เมย':4,'พค':5,'มิย':6,'กค':7,'สค':8,'กย':9,'ตค':10,'พย':11,'ธค':12 };
const MON_DOT = { 'มค':'ม.ค.','กพ':'ก.พ.','มีค':'มี.ค.','เมย':'เม.ย.','พค':'พ.ค.','มิย':'มิ.ย.','กค':'ก.ค.','สค':'ส.ค.','กย':'ก.ย.','ตค':'ต.ค.','พย':'พ.ย.','ธค':'ธ.ค.' };
const MON_RE = new RegExp('(\\d{1,2})\\s*(' + Object.keys(MON).join('|') + ')(?![ก-๙])\\s*(25\\d{2}(?!\\d))?');
function parseWhen(t){
  const m = t.match(MON_RE); if (!m) return null;
  const today = todayISO(); let y = +today.slice(0, 4);
  if (m[3]){ y = +m[3]; if (y > 2400) y -= 543; }
  let date = y + '-' + ('0' + MON[m[2]]).slice(-2) + '-' + ('0' + m[1]).slice(-2);
  if (!m[3] && date < today) date = (y + 1) + date.slice(4);
  const rest = t.replace(m[0], ' ');
  const tm = rest.match(/(?:^|\D)([01]?\d|2[0-3])[:.]?([0-5]\d)(?!\d)/);
  return { date, time: tm ? ('0' + tm[1]).slice(-2) + ':' + tm[2] : '' };
}
$('tGo').onclick = async () => {
  const text = $('typed').value.trim(); if (!text) return;
  const p = splitTyped(text);
  close('bgType');
  if (p.length < 2){ handleText(text); return; }
  rawText = text; editId = '';
  let d = parseWhen(p[0]) || { date: '', time: '' };
  if (p[0] && (!d || !d.time)){
    toast('กำลังอ่านวันที่/เวลา…', 8000);
    try{
      const t0 = p[0].replace(MON_RE, (all, dd, mo, yy) => dd + ' ' + MON_DOT[mo] + (yy ? ' ' + yy : ''));
      const sv = await api('parse', { text: t0 });
      d = { date: (d && d.date) || sv.date || '', time: (d && d.time) || sv.time || '' };
    }catch(e){ toast(e.message, 4000); d = d || { date: '', time: '' }; }
    $('toast').classList.remove('show');
  }
  $('cRaw').textContent = '“' + text + '”';
  $('cDate').value = d.date || ''; $('cTime').value = d.time || '';
  $('cTitle').value = spellT(p[1] || ''); $('cLoc').value = spellT(p[2] || '');
  $('cChair').value = spellT(p[3] || ''); $('cDress').value = spellT(p[4] || ''); $('cOwner').value = '';
  $('cDet').value = p.slice(5).filter(Boolean).join(' ');
  const need = [];
  if (!d.date) need.push('วันที่'); if (!d.time) need.push('เวลา');
  const hint = $('cHint');
  hint.style.display = need.length ? 'block' : 'none';
  hint.textContent = need.length ? 'อ่าน ' + need.join(', ') + ' ไม่ได้ กรอกเองก่อนบันทึก' : '';
  $('typed').value = ''; $('tPrev').innerHTML = '';
  open('bgConfirm');
};
const FORM_ORDER = ['cTitle','cLoc','cChair','cDress','cOwner','cDet'];
FORM_ORDER.forEach((id, i) => $(id).addEventListener('keydown', e => {
  if (e.key !== 'Enter' || e.isComposing || e.keyCode === 229) return;
  e.preventDefault();
  if (FORM_ORDER[i + 1]) $(FORM_ORDER[i + 1]).focus(); else $(id).blur();
}));
let impRows = [];
$('tImport').onclick = () => {
  close('bgType');
  $('impFile').value = ''; $('impName').textContent = ''; $('impText').value = '';
  $('impIn').style.display = ''; $('impOut').style.display = 'none';
  $('impRead').style.display = ''; $('impSave').style.display = 'none';
  open('bgImp');
};
$('impFile').onchange = () => {
  const fs = [...$('impFile').files];
  if (fs.length > 6){ toast('เลือกได้ไม่เกิน 6 รูป'); $('impFile').value = ''; $('impName').textContent = ''; return; }
  $('impName').textContent = fs.length ? '✓ เลือก ' + fs.length + ' รูป' : '';
};
function imgToB64(file){
  return new Promise((ok, no) => {
    const url = URL.createObjectURL(file), im = new Image();
    im.onload = () => {
      const k = Math.min(1, 2200 / Math.max(im.width, im.height));
      const c = document.createElement('canvas'); c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); ok(c.toDataURL('image/jpeg', 0.88).split(',')[1]);
    };
    im.onerror = () => { URL.revokeObjectURL(url); no(new Error('เปิดรูปไม่ได้')); };
    im.src = url;
  });
}
$('impRead').onclick = async () => {
  const files = [...$('impFile').files], text = $('impText').value.trim();
  if (!files.length && !text){ toast('เลือกรูป หรือวางข้อความก่อน'); return; }
  const btn = $('impRead'); btn.disabled = true; btn.textContent = 'กำลังอ่าน…';
  const jobs = files.length ? files.map(f => ({ f })) : [{ text }];
  const all = [], bad = [];
  for (let i = 0; i < jobs.length; i++){
    toast('กำลังอ่านรูปที่ ' + (i + 1) + '/' + jobs.length + '…', 90000);
    try{
      const payload = jobs[i].f ? { image: await imgToB64(jobs[i].f), mime: 'image/jpeg' } : { text };
      if (jobs[i].f && text) payload.text = text;
      all.push(...await api('importParse', payload));
    }catch(e){ bad.push('รูปที่ ' + (i + 1) + ': ' + e.message); }
  }
  btn.disabled = false; btn.textContent = 'อ่านตาราง';
  if (!all.length){ toast(bad.length ? bad[0] : 'ไม่พบรายการในตาราง', 6000); return; }
  const seen = new Set();
  impRows = all.filter(r => {
    const k = [r.date, r.time, r.title].join('|');
    if (r.date && r.time && r.title){ if (seen.has(k)) return false; seen.add(k); }
    return true;
  }).sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));
  $('toast').classList.remove('show');
  showImp();
  if (bad.length) toast('อ่านไม่สำเร็จ ' + bad.length + ' รูป — ' + bad[0], 7000);
};
function showImp(){
  $('impIn').style.display = 'none'; $('impOut').style.display = '';
  $('impRead').style.display = 'none'; $('impSave').style.display = '';
  let h = '';
  impRows.forEach((r, i) => {
    const ok = r.title && r.date && r.time;
    const sub = [r.location, r.chair && 'ผู้เกี่ยวข้อง : ' + r.chair, r.dress && 'การแต่งกาย : ' + r.dress, r.owner && 'ผู้รับผิดชอบ : ' + r.owner]
      .filter(Boolean).map(x => `<div class="ss">${esc(x)}</div>`).join('');
    h += `<label class="irow${r.dup ? ' dup' : ''}"><input type="checkbox" data-i="${i}" ${ok && !r.dup ? 'checked' : ''} ${ok ? '' : 'disabled'}>
      <div><div class="tt">${esc(r.date ? new Date(r.date + 'T00:00:00+07:00').toLocaleDateString('th-TH', { weekday:'short', day:'numeric', month:'short', timeZone:'Asia/Bangkok' }) : '(ไม่มีวันที่)')} · ${esc(r.time || '--:--')}
      ${r.dup ? '<span class="tag">มีในปฏิทินแล้ว</span>' : ''}${ok ? '' : '<span class="tag">ข้อมูลไม่ครบ</span>'}</div>
      <div>${esc(r.title || '(ไม่มีเรื่อง)')}</div>${sub}</div></label>`;
  });
  $('impList').innerHTML = h || '<div class="empty">ไม่พบรายการในตาราง</div>';
  $('impList').querySelectorAll('input').forEach(c => c.onchange = updImpCount);
  updImpCount();
}
function updImpCount(){
  const n = $('impList').querySelectorAll('input:checked').length;
  $('impSum').textContent = 'พบ ' + impRows.length + ' รายการ · ติ๊กไว้ ' + n + ' (รายการที่มีในปฏิทินแล้วไม่ติ๊กให้)';
  $('impSave').textContent = 'บันทึกที่เลือก (' + n + ')'; $('impSave').disabled = !n;
}
$('impSave').onclick = async () => {
  const rows = [...$('impList').querySelectorAll('input:checked')].map(c => impRows[+c.dataset.i]);
  if (!rows.length) return;
  const btn = $('impSave'); btn.disabled = true; btn.textContent = 'กำลังบันทึก…';
  toast('กำลังบันทึก ' + rows.length + ' รายการ…', 120000);
  try{
    const r = await api('addMany', { rows });
    close('bgImp'); refresh();
    toast('เพิ่ม ' + r.added + ' รายการ ✓' + (r.failed.length ? ' · ไม่สำเร็จ ' + r.failed.length : ''), 5000);
  }catch(e){ toast(e.message, 5000); btn.disabled = false; updImpCount(); }
};

$('btnRef').onclick = () => { toast('กำลังรีเฟรช…', 1200); refresh(); };

async function handleText(text){
  rawText = text; editId = ''; toast('กำลังแยกข้อความ…', 8000);
  try{
    const d = await api('parse', { text });
    $('toast').classList.remove('show');
    $('cRaw').textContent = '“' + text + '”';
    $('cTitle').value = d.title || ''; $('cDate').value = d.date || '';
    $('cTime').value = d.time || ''; $('cLoc').value = d.location || '';
    $('cChair').value = d.chair || ''; $('cDress').value = d.dress || ''; $('cOwner').value = ''; $('cDet').value = d.details || '';
    const need = [];
    if (!d.date) need.push('วันที่'); if (!d.time) need.push('เวลา'); if (!d.title) need.push('เรื่อง');
    const hint = $('cHint');
    const msgs = [];
    if (d.source === 'rules') msgs.push('ใช้ตัวแยกแบบง่าย (ไม่ได้ตั้ง Gemini) กรุณาตรวจทุกช่อง');
    if (need.length) msgs.push('กรอก ' + need.join(', ') + ' ให้ครบก่อนบันทึก');
    hint.style.display = msgs.length ? 'block' : 'none'; hint.textContent = msgs.join(' · ');
    open('bgConfirm');
  }catch(e){ toast(e.message, 4000); }
}

$('cSave').onclick = async () => {
  const d = { title: $('cTitle').value.trim(), date: $('cDate').value, time: $('cTime').value,
              location: $('cLoc').value.trim(), chair: $('cChair').value.trim(), dress: $('cDress').value.trim(), owner: $('cOwner').value.trim(),
              details: $('cDet').value.trim(), raw: rawText, id: editId };
  ['cTitle','cDate','cTime'].forEach(i => $(i).classList.remove('need'));
  const miss = [['title','cTitle'],['date','cDate'],['time','cTime']].filter(([k]) => !d[k]);
  if (miss.length){ miss.forEach(([,i]) => $(i).classList.add('need')); toast('กรอกเรื่อง วันที่ เวลา ให้ครบ'); return; }
  const btn = $('cSave'); btn.disabled = true; btn.textContent = 'กำลังบันทึก…';
  try{
    const wasEdit = !!editId;
    await api(wasEdit ? 'update' : 'add', d);
    close('bgConfirm'); toast(wasEdit ? 'แก้ไขแล้ว ✓' : 'เพิ่มนัดแล้ว ✓'); refresh();
  }catch(e){ toast(e.message, 4000); }
  btn.disabled = false; btn.textContent = 'บันทึกลงปฏิทิน';
};

$('sSave').onclick = async () => {
  cfg = { url: $('sUrl').value.trim(), token: $('sTok').value.trim() };
  store.set('url', cfg.url); store.set('token', cfg.token);
  try{ await api('ping'); close('bgSet'); toast('เชื่อมต่อสำเร็จ ✓'); refresh(); }
  catch(e){ toast('เชื่อมต่อไม่ได้: ' + e.message, 4000); }
};

if (!cfg.url || !cfg.token) open('bgSet');
refresh();
</script>
</body>
