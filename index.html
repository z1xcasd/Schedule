<script>
const $ = id => document.getElementById(id);
const store = {
  get(k){ try{ return localStorage.getItem(k) || ''; }catch(e){ return ''; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
};
let cfg = { url: store.get('url'), token: store.get('token') };
let rawText = '', items = [], editId = '', cur = null;

function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(msg, ms=2600){ const t=$('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),ms); }
function open(id){ $(id).classList.add('show'); }
function close(id){ $(id).classList.remove('show'); if (id === 'bgConfirm') editId = ''; }
document.querySelectorAll('[data-close]').forEach(b => b.onclick = () => close(b.dataset.close));

const todayISO = () => new Date().toLocaleDateString('sv-SE', { timeZone: 'Asia/Bangkok' });

async function api(action, payload = {}) {
  if (!cfg.url || !cfg.token) { open('bgSet'); throw new Error('ตั้งค่าลิงก์และรหัสก่อน'); }
  const r = await fetch(cfg.url, { method: 'POST', body: JSON.stringify({ token: cfg.token, action, ...payload }) });
  const j = await r.json();
  if (!j.ok) throw new Error(j.error || 'เกิดข้อผิดพลาด');
  return j.data;
}

function fmtDay(d){
  return new Date(d + 'T00:00:00+07:00').toLocaleDateString('th-TH',
    { weekday:'long', day:'numeric', month:'long', year:'numeric', timeZone:'Asia/Bangkok' });
}
const TEL_RE = /(?<!\d)0\d{1,2}[-\s]?\d{3}[-\s]?\d{3,4}(?!\d)/g;
const telLink = t => esc(t).replace(TEL_RE, m => `<a class="tel" href="tel:${m.replace(/\D/g, '')}">${m}</a>`);
const phonesOf = it => [...new Set([it.owner, it.details, it.chair, it.location].filter(Boolean).join(' ').match(TEL_RE) || [])];
function dayBadge(d, t){
  const n = Math.round((Date.parse(d + 'T00:00:00Z') - Date.parse(t + 'T00:00:00Z')) / 86400000);
  if (n === 0) return '<span class="today">วันนี้</span>';
  if (n === 1) return '<span class="soon">พรุ่งนี้</span>';
  return n > 1 ? `<span class="soon">อีก ${n} วัน</span>` : '';
}
const BELL_SM = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>';
function render(){
  const el = $('list');

function splitTyped(t){

  const parts = t.split(/(\s{2,}|\n+)/), out = [parts[0].trim()];

    const sep = parts[i], k = Math.max(1, /\n/.test(sep) ? 1 : Math.floor(sep.length / 2));
    for (let j = 1; j < k; j++) out.push('');
    out.push((parts[i + 1] || '').trim());
  }
  while (out.length && !out[out.length - 1]) out.pop();
  return out;
}

const MON = { 'มค':1,'กพ':2,'มีค':3,'เมย':4,'พค':5,'มิย':6,'กค':7,'สค':8,'กย':9,'ตค':10,'พย':11,'ธค':12 };

  const rest = t.replace(m[0], ' ');
  const rg = rest.match(/(?:^|\D)([01]?\d|2[0-3])[:.]?([0-5]\d)\s*(?:-|–|—|ถึง)+\s*([01]?\d|2[0-3])[:.]?([0-5]\d)(?!\d)/);
  if (rg){
    const t1 = ('0' + rg[1]).slice(-2) + ':' + rg[2], t2 = ('0' + rg[3]).slice(-2) + ':' + rg[4];
    return { date, time: t1, end: t2 > t1 ? t2 : '' };
  }
  const tm = rest.match(/(?:^|\D)([01]?\d|2[0-3])[:.]?([0-5]\d)(?!\d)/);
  return { date, time: tm ? ('0' + tm[1]).slice(-2) + ':' + tm[2] : '', end: '' };

function imgToB64(file){
  return new Promise((ok, no) => {
    const url = URL.createObjectURL(file), im = new Image();
    im.onload = () => {
      const k = Math.min(1, 2600 / Math.max(im.width, im.height));
      const c = document.createElement('canvas'); c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); ok(c.toDataURL('image/jpeg', 0.9).split(',')[1]);
    };
    im.onerror = () => { URL.revokeObjectURL(url); no(new Error('เปิดรูปไม่ได้')); };
    im.src = url;
  });
}

  $('impSave').textContent = 'บันทึกที่เลือก (' + sel.length + ')'; $('impSave').disabled = !sel.length;
}
$('impSave').onclick = async () => {
  const rows = [...$('impList').querySelectorAll('input:checked')].map(c => { const r = impRows[+c.dataset.i]; return Object.assign({}, r, { match: undefined, matchId: r.match ? r.match.id : '' }); });
  if (!rows.length) return;
  const btn = $('impSave'); btn.disabled = true; btn.textContent = 'กำลังบันทึก…';
  toast('กำลังบันทึก ' + rows.length + ' รายการ…', 120000);
  try{
    const r = await api('addMany', { rows });
    close('bgImp'); refresh();
    toast([r.added && 'เพิ่ม ' + r.added, r.updated && 'อัปเดต ' + r.updated].filter(Boolean).join(' · ') + ' ✓' + (r.failed.length ? ' · ไม่สำเร็จ ' + r.failed.length : ''), 5000);
  }catch(e){ toast(e.message, 5000); btn.disabled = false; updImpCount(); }
};

$('btnRef').onclick = () => { toast('กำลังรีเฟรช…', 1200); refresh(); };

async function handleText(text){
  rawText = text; editId = ''; toast('กำลังแยกข้อความ…', 8000);
  try{
    const d = await api('parse', { text });
    $('toast').classList.remove('show');
    $('cRaw').textContent = '“' + text + '”';
    $('cTitle').value = d.title || ''; $('cDate').value = d.date || '';
    $('cTime').value = d.time || ''; $('cEnd').value = ''; $('cLoc').value = d.location || ''; $('cMap').value = '';
    $('cChair').value = d.chair || ''; $('cDress').value = d.dress || ''; $('cOwner').value = ''; $('cDet').value = d.details || '';
    const need = [];
    if (!d.date) need.push('วันที่'); if (!d.time) need.push('เวลา'); if (!d.title) need.push('เรื่อง');
    const hint = $('cHint');
    const msgs = [];
    if (d.source === 'rules') msgs.push('ใช้ตัวแยกแบบง่าย (ไม่ได้ตั้ง Gemini) กรุณาตรวจทุกช่อง');
    if (need.length) msgs.push('กรอก ' + need.join(', ') + ' ให้ครบก่อนบันทึก');
    hint.style.display = msgs.length ? 'block' : 'none'; hint.textContent = msgs.join(' · ');
    open('bgConfirm');
  }catch(e){ toast(e.message, 4000); }
}

$('cSave').onclick = async () => {
  const d = { title: $('cTitle').value.trim(), date: $('cDate').value, time: $('cTime').value, endTime: $('cEnd').value,
              location: $('cLoc').value.trim(), map: $('cMap').value.trim(), chair: $('cChair').value.trim(), dress: $('cDress').value.trim(), owner: $('cOwner').value.trim(),
              details: $('cDet').value.trim(), raw: rawText, id: editId };
  ['cTitle','cDate','cTime','cMap'].forEach(i => $(i).classList.remove('need'));
  if (d.map && !/^https?:\/\/\S+$/.test(d.map)){ $('cMap').classList.add('need'); toast('ลิงก์แผนที่ต้องขึ้นต้นด้วย https://'); return; }
  const miss = [['title','cTitle'],['date','cDate'],['time','cTime']].filter(([k]) => !d[k]);
  if (miss.length){ miss.forEach(([,i]) => $(i).classList.add('need')); toast('กรอกเรื่อง วันที่ เวลา ให้ครบ'); return; }
  const btn = $('cSave'); btn.disabled = true; btn.textContent = 'กำลังบันทึก…';
  try{
    const wasEdit = !!editId;
    await api(wasEdit ? 'update' : 'add', d);
    close('bgConfirm'); toast(wasEdit ? 'แก้ไขแล้ว ✓' : 'เพิ่มนัดแล้ว ✓'); refresh();
  }catch(e){ toast(e.message, 4000); }
  btn.disabled = false; btn.textContent = 'บันทึกลงปฏิทิน';
};

let remId = '';
function remNote(){
  const all = $('rAll').checked;
  $('rTimeBox').style.display = all ? 'none' : '';
  let t = 'เตือนเวลา 07:30 ของวันนั้น';
  if (!all){
    const v = $('rTime').value;
    t = v && v < '07:40' ? 'เตือนก่อนเวลา 10 นาที' : 'เตือน 2 ครั้ง: 07:30 ของวันนั้น และก่อนเวลา 10 นาที';
  }
  $('rNote').textContent = t;
}
function openRem(it){
  remId = it ? it.id : '';
  $('rHead').textContent = it ? 'แก้ไขเตือนความจำ' : 'บันทึกเตือนความจำ';
  $('rTitle').value = it ? it.title : '';
  $('rDate').value = it ? it.date : todayISO();
  $('rAll').checked = it ? !!it.allDay : true;
  $('rTime').value = it && !it.allDay ? it.time : '';
  $('rDet').value = it ? it.details : '';
  ['rTitle','rDate','rTime'].forEach(i => $(i).classList.remove('need'));
  remNote(); open('bgRem');
  if (!it) setTimeout(() => $('rTitle').focus(), 150);
}
$('btnRem').onclick = () => openRem(null);
$('rAll').onchange = remNote;
$('rTime').addEventListener('input', remNote);
$('rTitle').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing && e.keyCode !== 229){ e.preventDefault(); $('rTitle').blur(); } });
$('rSave').onclick = async () => {
  const d = { id: remId, title: $('rTitle').value.trim(), date: $('rDate').value, allDay: $('rAll').checked, time: $('rTime').value, details: $('rDet').value.trim() };
  ['rTitle','rDate','rTime'].forEach(i => $(i).classList.remove('need'));
  const miss = [['title','rTitle'],['date','rDate']].concat(d.allDay ? [] : [['time','rTime']]).filter(([k]) => !d[k]);
  if (miss.length){ miss.forEach(([,i]) => $(i).classList.add('need')); toast('กรอกเรื่อง วันที่' + (d.allDay ? '' : ' เวลา') + ' ให้ครบ'); return; }
  const btn = $('rSave'); btn.disabled = true; btn.textContent = 'กำลังบันทึก…';
  try{
    await api('remSave', d);
    close('bgRem'); toast(remId ? 'แก้ไขเตือนความจำแล้ว ✓' : 'บันทึกเตือนความจำแล้ว ✓'); refresh();
  }catch(e){ toast(e.message, 4000); }
  btn.disabled = false; btn.textContent = 'บันทึก';
};

$('sSave').onclick = async () => {
  cfg = { url: $('sUrl').value.trim(), token: $('sTok').value.trim() };
  store.set('url', cfg.url); store.set('token', cfg.token);
  try{ await api('ping'); close('bgSet'); toast('เชื่อมต่อสำเร็จ ✓'); refresh(); }
  catch(e){ toast('เชื่อมต่อไม่ได้: ' + e.message, 4000); }
};

if (!cfg.url || !cfg.token) open('bgSet');
refresh();
</script>
