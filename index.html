html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Sarabun',system-ui,sans-serif;font-size:17px}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;
  padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;background:var(--bg);border-bottom:1px solid var(--line)}
header h1{margin:0;font-size:22px;font-weight:700}
.icon-btn{border:0;background:transparent;color:var(--muted);font-size:22px;padding:6px 10px;border-radius:10px;font-family:inherit}
main{padding:12px 16px 140px;max-width:640px;margin:0 auto}
.day{margin:18px 0 8px;font-weight:700;color:var(--muted);font-size:15px;display:flex;gap:8px;align-items:center}
.day .today{background:var(--accent);color:var(--accent-ink);border-radius:99px;padding:1px 10px;font-size:13px}
.item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px;display:flex;gap:12px}
.item .t{font-weight:700;min-width:52px;color:var(--accent)}
.item .b{flex:1;min-width:0}
.item .title{font-weight:500}
.item .sub{color:var(--muted);font-size:15px;margin-top:2px;word-break:break-word}
.empty{text-align:center;color:var(--muted);margin-top:60px;line-height:1.7}
.dock{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;align-items:center;gap:22px;
  padding:14px 16px calc(env(safe-area-inset-bottom) + 18px);background:linear-gradient(transparent,var(--bg) 40%)}
.fab{width:76px;height:76px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);
  font-size:42px;line-height:1;font-weight:400;box-shadow:0 8px 24px rgba(15,118,110,.35);font-family:inherit}
.fab:active{transform:scale(.95)}
.side{width:48px;height:48px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:20px;font-family:inherit}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:20}
.sheet-bg.show{display:flex}
.sheet{width:100%;max-width:640px;background:var(--card);border-radius:22px 22px 0 0;padding:20px 18px calc(env(safe-area-inset-bottom) + 20px);max-height:92vh;overflow:auto}
.sheet h2{margin:0 0 12px;font-size:19px}
label{display:block;font-size:14px;color:var(--muted);margin:12px 0 4px}
input,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
input.need{border-color:var(--warn)}
textarea{min-height:92px;resize:vertical}
.row{display:flex;gap:10px}.row>div{flex:1}
.btns{display:flex;gap:10px;margin-top:18px}
.btn{flex:1;border:0;border-radius:14px;padding:13px;font:inherit;font-weight:700;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:500}
.btn:disabled{opacity:.5}
.raw{font-size:14px;color:var(--muted);background:var(--bg);border-radius:10px;padding:8px 10px;margin-bottom:4px;word-break:break-word}
.hint{font-size:14px;color:var(--warn);margin:6px 0 0}
.listen{text-align:center}
.pulse{width:84px;height:84px;border-radius:50%;background:var(--accent);margin:8px auto 16px;animation:p 1.2s infinite}
@keyframes p{0%{box-shadow:0 0 0 0 rgba(45,212,191,.5)}100%{box-shadow:0 0 0 30px rgba(45,212,191,0)}}
.transcript{min-height:56px;font-size:19px;line-height:1.5;word-break:break-word}
.toast{position:fixed;left:50%;bottom:130px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-size:15px;z-index:40;opacity:0;pointer-events:none;transition:opacity .2s;max-width:88vw;text-align:center}
.toast.show{opacity:1}
.item{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;transition:transform .15s,opacity .15s}
.item.press{transform:scale(.98);opacity:.85}
.act-title{font-weight:700;font-size:19px}
.act-sub{color:var(--muted);font-size:15px;margin:2px 0 8px}
.act{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--ink);font:inherit;padding:15px 4px}
.act.danger{color:var(--danger)}
.wstep{color:var(--muted);font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.chip{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:5px 11px;font:inherit;font-size:14px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.skip{color:var(--muted)}
.wstate{min-height:22px;margin-top:8px;font-size:14px;color:var(--muted)}
.wstate.on{color:var(--accent)}
.wstate.err{color:var(--warn)}
</style>
</head>
<body>
<header>
  <h1>ตารางงาน</h1>
  <button class="icon-btn" id="btnSet" aria-label="ตั้งค่า">⚙︎</button>
</header>
<main id="list"></main>

<div class="dock">
  <button class="side" id="btnType" aria-label="พิมพ์แทน">⌨︎</button>
  <button class="fab" id="btnAdd" aria-label="พูดเพื่อเพิ่มนัด">+</button>
  <button class="side" id="btnRef" aria-label="รีเฟรช">↻</button>
</div>

<!-- ทีละหัวข้อ -->
<div class="sheet-bg" id="bgWiz"><div class="sheet">
  <div class="wstep" id="wStep"></div>
  <h2 id="wLabel"></h2>
  <div class="chips" id="wChips"></div>
  <input id="wInput" enterkeyhint="next" autocomplete="off" autocapitalize="off">
  <div class="wstate" id="wState"></div>
  <div class="btns" style="margin-top:12px">
    <button class="btn ghost" id="wMic">🎤 พูด</button>
    <button class="btn ghost" id="wSkip">ข้าม</button>
  </div>
  <div class="btns" style="margin-top:10px">
    <button class="btn ghost" id="wCancel">ยกเลิก</button>
    <button class="btn" id="wNext">ถัดไป</button>
  </div>
</div></div>

<!-- ยืนยัน -->
<div class="sheet-bg" id="bgConfirm"><div class="sheet">
  <h2>ตรวจสอบก่อนบันทึก</h2>
  <div class="raw" id="cRaw"></div>
  <div class="row">
    <div><label>วันที่</label><input id="cDate" type="date"></div>
    <div><label>เวลา</label><input id="cTime" type="time"></div>
  </div>
  <label>เรื่อง</label><input id="cTitle" enterkeyhint="next">
  <label>สถานที่</label><input id="cLoc" enterkeyhint="next">
  <label>ประธาน</label><input id="cChair" enterkeyhint="next" placeholder="เช่น รอง ผบ.ศสร. 1">
  <label>การแต่งกาย</label><input id="cDress" enterkeyhint="next" placeholder="เช่น ชุดสีกากี">
  <label>รายละเอียดอื่นๆ</label><input id="cDet">
  <div class="hint" id="cHint" style="display:none"></div>
  <div class="btns">
    <button class="btn ghost" data-close="bgConfirm">ยกเลิก</button>
    <button class="btn" id="cSave">บันทึกลงปฏิทิน</button>
  </div>
</div></div>

<!-- ตั้งค่า -->
<div class="sheet-bg" id="bgSet"><div class="sheet">
  <h2>ตั้งค่า</h2>
  <label>ลิงก์เว็บแอป (Apps Script /exec)</label><input id="sUrl" inputmode="url" placeholder="https://script.google.com/macros/s/.../exec">
  <label>รหัส (APP_TOKEN)</label><input id="sTok" autocapitalize="off" autocomplete="off">
  <div class="btns">
    <button class="btn ghost" data-close="bgSet">ปิด</button>
    <button class="btn" id="sSave">บันทึกและทดสอบ</button>
  </div>
</div></div>

<!-- เมนูกดค้างที่งาน -->
<div class="sheet-bg" id="bgAct"><div class="sheet">
  <div class="act-title" id="aTitle"></div>
  <div class="act-sub" id="aSub"></div>
  <button class="act" id="aHour">⏩ เลื่อน +1 ชั่วโมง</button>
  <button class="act" id="aTomorrow">⏩ เลื่อนไปพรุ่งนี้ (เวลาเดิม)</button>
  <button class="act" id="aEdit">✎ แก้ไข / เลือกวัน-เวลาใหม่</button>
  <button class="act danger" id="aDel">✕ ยกเลิกนัด</button>
  <div class="btns"><button class="btn ghost" data-close="bgAct">ปิด</button></div>
</div></div>

<div class="toast" id="toast"></div>

<script>
const $ = id => document.getElementById(id);
const store = {
  get(k){ try{ return localStorage.getItem(k) || ''; }catch(e){ return ''; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
};
let cfg = { url: store.get('url'), token: store.get('token') };
let rawText = '', items = [], editId = '', cur = null;

function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(msg, ms=2600){ const t=$('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),ms); }
function open(id){ $(id).classList.add('show'); }
function close(id){ $(id).classList.remove('show'); if (id === 'bgConfirm') editId = ''; }
document.querySelectorAll('[data-close]').forEach(b => b.onclick = () => close(b.dataset.close));

const todayISO = () => new Date().toLocaleDateString('sv-SE', { timeZone: 'Asia/Bangkok' });

async function api(action, payload = {}) {
  if (!cfg.url || !cfg.token) { open('bgSet'); throw new Error('ตั้งค่าลิงก์และรหัสก่อน'); }
  const r = await fetch(cfg.url, { method: 'POST', body: JSON.stringify({ token: cfg.token, action, ...payload }) });
  const j = await r.json();
  if (!j.ok) throw new Error(j.error || 'เกิดข้อผิดพลาด');
  return j.data;
}

/* ---------- รายการนัด ---------- */
function fmtDay(d){
  return new Date(d + 'T00:00:00+07:00').toLocaleDateString('th-TH',
    { weekday:'long', day:'numeric', month:'long', year:'numeric', timeZone:'Asia/Bangkok' });
}
function render(){
  const el = $('list');
  const now = Date.now();
  const list = items.filter(it => it.endMs > now);   // งานที่ผ่านไปแล้วหายจากหน้านี้ (ยังอยู่ในปฏิทิน)
  if (!list.length){ el.innerHTML = '<div class="empty">ไม่มีนัดที่จะถึง<br>กด + แล้วพูดได้เลย</div>'; return; }
  const t = todayISO(); let html = '', last = '';
  for (const it of list){
    if (it.date !== last){
      last = it.date;
      html += `<div class="day">${esc(fmtDay(it.date))}${it.date===t?'<span class="today">วันนี้</span>':''}</div>`;
    }
    const subs = [it.location, it.chair && 'ประธาน : ' + it.chair, it.dress && 'การแต่งกาย : ' + it.dress, it.details]
      .filter(Boolean).map(x => `<div class="sub">${esc(x)}</div>`).join('');
    html += `<div class="item" data-id="${esc(it.id)}"><div class="t">${esc(it.time)}</div><div class="b"><div class="title">${esc(it.title)}</div>${subs}</div></div>`;
  }
  el.innerHTML = html;
  el.querySelectorAll('.item').forEach(bindPress);
}
async function refresh(){
  const el = $('list');
  if (!cfg.url || !cfg.token) { el.innerHTML = '<div class="empty">ยังไม่ได้ตั้งค่า<br>กด ⚙︎ ที่มุมขวาบน</div>'; return; }
  try{
    items = await api('list');
    items.sort((a,b) => (a.date+a.time).localeCompare(b.date+b.time));
    render();
  }catch(e){ el.innerHTML = `<div class="empty">โหลดไม่ได้<br>${esc(e.message)}</div>`; }
}
setInterval(render, 60000);

/* ---------- กดค้างที่งาน ---------- */
function bindPress(el){
  let timer = null;
  const cancel = () => { clearTimeout(timer); timer = null; el.classList.remove('press'); };
  el.addEventListener('touchstart', () => {
    el.classList.add('press');
    timer = setTimeout(() => { cancel(); if (navigator.vibrate) navigator.vibrate(20); openAct(el.dataset.id); }, 500);
  }, { passive: true });
  el.addEventListener('touchmove', cancel, { passive: true });
  el.addEventListener('touchend', cancel);
  el.addEventListener('touchcancel', cancel);
  el.addEventListener('contextmenu', e => { e.preventDefault(); cancel(); openAct(el.dataset.id); });
}
function openAct(id){
  cur = items.find(i => i.id === id); if (!cur) return;
  $('aTitle').textContent = cur.title;
  $('aSub').textContent = fmtDay(cur.date) + ' · ' + cur.time;
  open('bgAct');
}
function shift(it, addMs){
  const d = new Date(new Date(it.date + 'T' + it.time + ':00+07:00').getTime() + addMs);
  return {
    date: d.toLocaleDateString('sv-SE', { timeZone: 'Asia/Bangkok' }),
    time: d.toLocaleTimeString('en-GB', { timeZone: 'Asia/Bangkok', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' })
  };
}
async function doMove(addMs){
  close('bgAct'); toast('กำลังเลื่อน…', 8000);
  const n = shift(cur, addMs);
  try{
    await api('update', { id: cur.id, title: cur.title, date: n.date, time: n.time, location: cur.location, chair: cur.chair, dress: cur.dress, details: cur.details });
    toast('เลื่อนแล้ว ✓'); refresh();
  }catch(e){ toast(e.message, 4000); }
}
$('aHour').onclick = () => doMove(3600000);
$('aTomorrow').onclick = () => doMove(86400000);
$('aEdit').onclick = () => {
  close('bgAct'); editId = cur.id;
  $('cRaw').textContent = 'แก้ไขนัด';
  $('cTitle').value = cur.title; $('cDate').value = cur.date; $('cTime').value = cur.time;
  $('cLoc').value = cur.location; $('cChair').value = cur.chair || ''; $('cDress').value = cur.dress || ''; $('cDet').value = cur.details;
  $('cHint').style.display = 'none';
  open('bgConfirm');
};
$('aDel').onclick = async () => {
  if (!confirm('ยกเลิกนัด "' + cur.title + '" ?\nจะลบออกจากปฏิทินด้วย')) return;
  close('bgAct'); toast('กำลังยกเลิก…', 8000);
  try{ await api('delete', { id: cur.id }); toast('ยกเลิกนัดแล้ว ✓'); refresh(); }
  catch(e){ toast(e.message, 4000); }
};

/* ---------- พูดทีละหัวข้อ (ไมค์ต่อเนื่อง) ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const STEPS = [
  { k:'when',     label:'วันที่และเวลา', ph:'เช่น 14 ตุลา 0830', req:true },
  { k:'title',    label:'เรื่อง',         ph:'เช่น ประชุม MB', req:true },
  { k:'location', label:'สถานที่',        ph:'เช่น ห้องประชุม 1 บก.ศสร.' },
  { k:'chair',    label:'ประธาน',         ph:'เช่น รอง ผบ.ศสร. 1' },
  { k:'dress',    label:'การแต่งกาย',     ph:'เช่น ชุดปกติกากีแกมเขียวคอพับแขนยาว' }
];
let wz = { i:0, vals:{}, voice:true, tok:0, busy:false, t0:0, err:'', seg:0, n:0, res:null, timer:null, skipT:null }, rec = null;

function spell(t){
  return t.replace(/\([^)]*\)|（[^）]*）/g, ' ').replace(/บอ[\s-]*กอ/g, 'บก.').replace(/\s+/g, ' ').trim();
}
function wState(msg, cls){ const e = $('wState'); e.textContent = msg || ''; e.className = 'wstate' + (cls ? ' ' + cls : ''); }
function stopRec(){
  wz.tok++; clearTimeout(wz.timer); clearTimeout(wz.skipT);
  if (rec){ try{ rec.abort(); }catch(e){} rec = null; }
  $('wMic').textContent = '🎤 พูด';
}
function segText(){
  if (!wz.res) return '';
  let t = ''; for (let i = wz.seg; i < wz.res.length; i++) t += wz.res[i][0].transcript;
  return t.trim();
}

function showStep(){
  const st = STEPS[wz.i];
  $('wStep').textContent = 'ขั้นที่ ' + (wz.i + 1) + '/' + STEPS.length + (st.req ? '' : ' (ข้ามได้)');
  $('wLabel').textContent = st.label;
  $('wInput').value = ''; $('wInput').placeholder = st.ph;
  $('wSkip').style.display = st.req ? 'none' : '';
  $('wNext').textContent = wz.i === STEPS.length - 1 ? 'เสร็จ' : 'ถัดไป';
  let h = '';
  STEPS.forEach((x, i) => {
    const v = wz.vals[x.k]; if (v === undefined || i === wz.i) return;
    const txt = x.k === 'when' ? v.date.slice(8) + '/' + v.date.slice(5, 7) + ' ' + v.time : v;
    h += `<button class="chip${txt ? '' : ' skip'}" data-i="${i}">${esc(x.label)}: ${esc(txt || 'ข้าม')} ✎</button>`;
  });
  $('wChips').innerHTML = h;
  $('wChips').querySelectorAll('.chip').forEach(c => c.onclick = () => redo(+c.dataset.i));
  clearTimeout(wz.skipT);
  if (rec){
    wState('🎤 กำลังฟัง… พูดได้เลย', 'on');
    const t = segText(); if (t) $('wInput').value = t;
    if (!st.req) wz.skipT = setTimeout(() => { if (rec && !wz.busy && !$('wInput').value.trim()) skip(); }, 6000);
  } else wState('');
}
function redo(i){
  delete wz.vals[STEPS[i].k]; wz.i = i; wz.seg = wz.n; showStep();
  if (wz.voice && !rec) listen(); else if (!wz.voice) $('wInput').focus();
}
function advance(){
  const n = STEPS.findIndex(x => wz.vals[x.k] === undefined);
  if (n < 0){ finish(); return; }
  wz.i = n; showStep();
  if (wz.voice && !rec) listen(); else if (!wz.voice) $('wInput').focus();
}

function listen(){
  if (rec) return;
  const my = ++wz.tok;
  if (!SR){ wz.voice = false; wState('เบราว์เซอร์นี้ไม่รองรับเสียง พิมพ์แล้วกด Enter', 'err'); $('wInput').focus(); return; }
  wz.t0 = Date.now(); wz.err = ''; wz.seg = 0; wz.n = 0; wz.res = null;
  try{
    const r = new SR(); r.lang = 'th-TH'; r.interimResults = true; r.continuous = true;
    r.onresult = e => {
      if (my !== wz.tok) return;
      wz.res = e.results; wz.n = e.results.length;
      const t = segText();
      if (!wz.busy) $('wInput').value = t;
      clearTimeout(wz.timer); clearTimeout(wz.skipT);
      if (t) wz.timer = setTimeout(() => { if (my === wz.tok && !wz.busy && segText()) commit(); }, 1600);
    };
    r.onerror = e => { if (my === wz.tok) wz.err = e.error; };
    r.onend = () => {
      if (my !== wz.tok) return;
      rec = null; $('wMic').textContent = '🎤 พูด';
      if (wz.err === 'not-allowed' || wz.err === 'service-not-allowed'){ wState('ไมค์ถูกบล็อก — อนุญาตไมค์ หรือพิมพ์แล้วกด Enter', 'err'); return; }
      if (wz.voice && !wz.busy && Date.now() - wz.t0 > 1200){ listen(); if (rec) return; }
      wState('ไมค์หยุด — แตะ 🎤 เพื่อพูดต่อ หรือพิมพ์แล้วกด Enter', 'err');
    };
    rec = r; r.start();
    $('wMic').textContent = '⏹ หยุด'; wState('🎤 กำลังฟัง… พูดได้เลย', 'on');
    const st = STEPS[wz.i];
    clearTimeout(wz.skipT);
    if (!st.req) wz.skipT = setTimeout(() => { if (rec && !wz.busy && !$('wInput').value.trim()) skip(); }, 6000);
  }catch(e){
    rec = null; $('wMic').textContent = '🎤 พูด';
    wState('แตะ 🎤 เพื่อเริ่มพูด หรือพิมพ์แล้วกด Enter', 'err');
  }
}

function skip(){
  if (STEPS[wz.i].req) return;
  wz.seg = wz.n; wz.vals[STEPS[wz.i].k] = ''; advance();
}
async function commit(){
  if (wz.busy) return;
  const st = STEPS[wz.i]; const t = $('wInput').value.trim();
  wz.seg = wz.n; clearTimeout(wz.timer);
  if (!t){
    if (st.req){ wState('หัวข้อนี้ต้องมี — พูดหรือพิมพ์ก่อน', 'err'); return; }
    skip(); return;
  }
  if (!st.req && /^(ข้าม|ไม่มี|ไม่ระบุ)$/.test(t.replace(/\s/g, ''))){ skip(); return; }
  if (st.k === 'when'){
    wz.busy = true; wState('กำลังอ่านวันที่/เวลา…');
    try{
      const d = await api('parse', { text: t });
      if (!d.date || !d.time){
        wState('จับ' + (!d.date && !d.time ? 'วันที่และเวลา' : !d.date ? 'วันที่' : 'เวลา') + 'ไม่ได้ ลองใหม่ เช่น 14 ตุลา 0830', 'err');
        wz.busy = false; if (!wz.voice) $('wInput').focus(); return;
      }
      wz.vals.when = { date: d.date, time: d.time, text: t };
    }catch(e){ wState(e.message, 'err'); wz.busy = false; return; }
    wz.busy = false;
  } else {
    wz.vals[st.k] = spell(t);
  }
  advance();
}
function finish(){
  stopRec(); close('bgWiz');
  const v = wz.vals;
  rawText = STEPS.map(x => x.k === 'when' ? (v.when && v.when.text) : v[x.k]).filter(Boolean).join(' / ');
  editId = '';
  $('cRaw').textContent = '“' + rawText + '”';
  $('cTitle').value = v.title || ''; $('cDate').value = v.when.date; $('cTime').value = v.when.time;
  $('cLoc').value = v.location || ''; $('cChair').value = v.chair || ''; $('cDress').value = v.dress || ''; $('cDet').value = '';
  $('cHint').style.display = 'none';
  open('bgConfirm');
}
function openWiz(){
  stopRec(); wz = { i:0, vals:{}, voice:true, tok:wz.tok + 1, busy:false, t0:0, err:'', seg:0, n:0, res:null, timer:null, skipT:null };
  open('bgWiz'); showStep(); listen();
}
$('btnAdd').onclick = openWiz;
$('wMic').onclick = () => { if (rec){ stopRec(); wz.voice = false; wState('หยุดแล้ว — พิมพ์แล้วกด Enter หรือแตะ 🎤 อีกครั้ง'); } else { wz.voice = true; $('wInput').blur(); listen(); } };
$('wNext').onclick = () => { if (rec){ stopRec(); wz.voice = false; } commit(); };
$('wSkip').onclick = skip;
$('wCancel').onclick = () => { stopRec(); close('bgWiz'); };
$('wInput').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.isComposing && e.keyCode !== 229){ e.preventDefault(); if (rec){ stopRec(); wz.voice = false; } commit(); }
});

/* ---------- พิมพ์เอง: ฟอร์มเดียว (วันที่/เวลา → เรื่อง → …) Enter = ช่องถัดไป ---------- */
$('btnType').onclick = () => {
  editId = ''; rawText = '';
  $('cRaw').textContent = 'พิมพ์เอง';
  $('cDate').value = todayISO(); $('cTime').value = '';
  ['cTitle','cLoc','cChair','cDress','cDet'].forEach(i => $(i).value = '');
  $('cHint').style.display = 'none';
  open('bgConfirm');
};
const FORM_ORDER = ['cTitle','cLoc','cChair','cDress','cDet'];
FORM_ORDER.forEach((id, i) => $(id).addEventListener('keydown', e => {
  if (e.key !== 'Enter' || e.isComposing || e.keyCode === 229) return;
  e.preventDefault();
  if (FORM_ORDER[i + 1]) $(FORM_ORDER[i + 1]).focus(); else $(id).blur();
}));

$('btnRef').onclick = () => { toast('กำลังรีเฟรช…', 1200); refresh(); };

$('cSave').onclick = async () => {
  const d = { title: $('cTitle').value.trim(), date: $('cDate').value, time: $('cTime').value,
              location: $('cLoc').value.trim(), chair: $('cChair').value.trim(), dress: $('cDress').value.trim(),
              details: $('cDet').value.trim(), raw: rawText, id: editId };
  ['cTitle','cDate','cTime'].forEach(i => $(i).classList.remove('need'));
  const miss = [['title','cTitle'],['date','cDate'],['time','cTime']].filter(([k]) => !d[k]);
  if (miss.length){ miss.forEach(([,i]) => $(i).classList.add('need')); toast('กรอกเรื่อง วันที่ เวลา ให้ครบ'); return; }
  const btn = $('cSave'); btn.disabled = true; btn.textContent = 'กำลังบันทึก…';
  try{
    const wasEdit = !!editId;
    await api(wasEdit ? 'update' : 'add', d);
    close('bgConfirm'); toast(wasEdit ? 'แก้ไขแล้ว ✓' : 'เพิ่มนัดแล้ว ✓'); refresh();
  }catch(e){ toast(e.message, 4000); }
  btn.disabled = false; btn.textContent = 'บันทึกลงปฏิทิน';
};

/* ---------- ตั้งค่า ---------- */
$('btnSet').onclick = () => { $('sUrl').value = cfg.url; $('sTok').value = cfg.token; open('bgSet'); };
$('sSave').onclick = async () => {
  cfg = { url: $('sUrl').value.trim(), token: $('sTok').value.trim() };
  store.set('url', cfg.url); store.set('token', cfg.token);
  try{ await api('ping'); close('bgSet'); toast('เชื่อมต่อสำเร็จ ✓'); refresh(); }
  catch(e){ toast('เชื่อมต่อไม่ได้: ' + e.message, 4000); }
};

if (!cfg.url || !cfg.token) open('bgSet');
refresh();
</script>
</body>
